name: cryptoaio
description: "CryptoAIO — All-in-One crypto tracker. Flutter frontend for the Flask backend."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.0
  provider: ^6.1.2
  fl_chart: ^0.70.2
  intl: ^0.20.1
  cached_network_image: ^3.4.1
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

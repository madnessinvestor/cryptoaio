name: Build Flutter APK

on:
  push:
    tags:
      - "v*"          # ex: v1.0.0 → gera APK de release
  workflow_dispatch:  # permite rodar manualmente na aba Actions

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Código ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java (obrigatório para o Android SDK) ────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 3. Flutter ──────────────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
          cache: true

      # ── 4. Cache Gradle (acelera builds repetidos) ──────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('flutter/android/**/*.gradle*', 'flutter/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 5. Dependências Flutter ─────────────────────────────────────────────
      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      # ── 6. Build ─────────────────────────────────────────────────────────────
      #   - Em push de tag → APK de release (não assinado)
      #   - Em workflow_dispatch → APK de debug (pronto para instalar e testar)
      - name: Build APK (release — triggered by tag)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: flutter
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build APK (debug — triggered manually)
        if: "!startsWith(github.ref, 'refs/tags/')"
        working-directory: flutter
        run: flutter build apk --debug --no-tree-shake-icons

      # ── 7. Renomeia o APK ────────────────────────────────────────────────────
      - name: Rename APK (release)
        if: startsWith(github.ref, 'refs/tags/')
        run: cp flutter/build/app/outputs/flutter-apk/app-release.apk CryptoAIO-Android.apk

      - name: Rename APK (debug)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: cp flutter/build/app/outputs/flutter-apk/app-debug.apk CryptoAIO-Android.apk

      # ── 8. Upload como artifact (sempre disponível na aba Actions) ───────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAIO-Android
          path: CryptoAIO-Android.apk
          retention-days: 30

      # ── 9. Anexa ao Release do GitHub (só em tags v*) ───────────────────────
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CryptoAIO-Android.apk

name: Build Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pywebview
      - name: Build
        run: pyinstaller CryptoAIO.spec --clean --noconfirm
      - name: Zip
        run: Compress-Archive -Path dist\CryptoAIO\* -DestinationPath CryptoAIO-Windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoAIO-Windows
          path: CryptoAIO-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-dev libgtk-3-dev libwebkit2gtk-4.0-dev || true
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pywebview
      - name: Build
        run: pyinstaller CryptoAIO.spec --clean --noconfirm
      - name: Zip
        run: zip -r CryptoAIO-Linux.zip dist/CryptoAIO/
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoAIO-Linux
          path: CryptoAIO-Linux.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pywebview
      - name: Build
        run: pyinstaller CryptoAIO.spec --clean --noconfirm
      - name: Zip
        run: zip -r CryptoAIO-macOS.zip dist/CryptoAIO.app/ || zip -r CryptoAIO-macOS.zip dist/CryptoAIO/
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoAIO-macOS
          path: CryptoAIO-macOS.zip

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { name: CryptoAIO-Windows, path: . }
      - uses: actions/download-artifact@v4
        with: { name: CryptoAIO-Linux, path: . }
      - uses: actions/download-artifact@v4
        with: { name: CryptoAIO-macOS, path: . }
      - uses: softprops/action-gh-release@v2
        with:
          name: "CryptoAIO ${{ github.ref_name }}"
          files: |
            CryptoAIO-Windows.zip
            CryptoAIO-Linux.zip
            CryptoAIO-macOS.zip
